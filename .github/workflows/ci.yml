name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node lib/cli/index.js install chromium --with-deps
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build
      - run: pnpm run lint:package
      # Verifies the built tree, then packs, extracts, and re-verifies the exact
      # tarball a profile installs: entry export shapes through the real Loader,
      # a real Cordis mount, `doctor`, and the build identity report.
      - run: pnpm run verify:package
      - run: pnpm run verify:tarball
